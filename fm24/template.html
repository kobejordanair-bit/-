<title>藍紅檔案館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EDEEF3; --panel:#F7F8FB; --panel-2:#E3E5EE; --sunk:#DCDEE9;
  --line:#C9CCDB; --line-soft:#DCDEE9;
  --text:#171A26; --text-2:#4B5068; --text-3:#767C96;
  --garnet:#9E1B3E; --garnet-soft:#C4577310; --azul:#2C4A94; --gold:#B08428;
  --ok:#256F51; --warn:#9A6410; --bad:#A43229;
  --ok-bg:#256F5118; --warn-bg:#9A641018; --bad-bg:#A4322918;
  --display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --rail:248px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D0F18; --panel:#141726; --panel-2:#1C2033; --sunk:#0A0C14;
    --line:#2A2F45; --line-soft:#1F2437;
    --text:#E8E9F0; --text-2:#A2A7BE; --text-3:#6E7490;
    --garnet:#E2536F; --garnet-soft:#E2536F1A; --azul:#7B9AE8; --gold:#D8AC4A;
    --ok:#4FBF90; --warn:#D9A03F; --bad:#E2706A;
    --ok-bg:#4FBF9018; --warn-bg:#D9A03F18; --bad-bg:#E2706A18;
  }
}
:root[data-theme="dark"]{
  --ground:#0D0F18; --panel:#141726; --panel-2:#1C2033; --sunk:#0A0C14;
  --line:#2A2F45; --line-soft:#1F2437;
  --text:#E8E9F0; --text-2:#A2A7BE; --text-3:#6E7490;
  --garnet:#E2536F; --garnet-soft:#E2536F1A; --azul:#7B9AE8; --gold:#D8AC4A;
  --ok:#4FBF90; --warn:#D9A03F; --bad:#E2706A;
  --ok-bg:#4FBF9018; --warn-bg:#D9A03F18; --bad-bg:#E2706A18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--body);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.015em}
a{color:var(--azul)}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;
  display:flex;flex-direction:column;padding:22px 16px;gap:22px;overflow-y:auto}
.stamp{display:flex;flex-direction:column;gap:4px}
.stamp .crest{display:flex;gap:3px;margin-bottom:8px}
.stamp .crest i{width:7px;height:22px;border-radius:1px;display:block}
.stamp h1{font-size:19px;line-height:1.15}
.stamp .sub{font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-3)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:baseline;gap:9px;background:none;border:0;cursor:pointer;
  text-align:left;padding:8px 10px;border-radius:5px;color:var(--text-2);width:100%}
nav button:hover{background:var(--panel-2);color:var(--text)}
nav button[aria-current="true"]{background:var(--garnet);color:#fff}
nav button[aria-current="true"] .k{color:#ffffffaa}
nav .k{font-family:var(--mono);font-size:10px;color:var(--text-3);min-width:16px}
nav .t{font-weight:500;font-size:13.5px}
.rail-foot{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:14px;
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);line-height:1.8}
.rail-foot b{color:var(--text-2);font-weight:500}
.themer{margin-top:10px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
  color:var(--text-2);width:100%;text-align:left}
.themer:hover{border-color:var(--garnet);color:var(--text)}

main{padding:34px 40px 80px;max-width:1180px}
.view{display:flex;flex-direction:column;gap:30px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--garnet);font-weight:600}
.view-head{display:flex;flex-direction:column;gap:6px;max-width:66ch}
.view-head h2{font-size:29px}
.view-head p{margin:0;color:var(--text-2);font-size:13.5px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:20px 22px}
.panel>h3{font-size:15px;margin-bottom:3px}
.panel>.cap{font-size:12px;color:var(--text-3);margin:0 0 16px}

/* ---------- stat strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
  border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.strip div{padding:15px 17px;border-right:1px solid var(--line-soft)}
.strip div:last-child{border-right:0}
.strip .n{font-family:var(--display);font-size:29px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.strip .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);margin-top:7px}
.strip .garnet .n{color:var(--garnet)}

/* ---------- season ribbon ---------- */
.ribbon{display:flex;gap:5px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.rib{flex:1 0 62px;background:none;border:0;padding:0;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:6px;border-radius:5px}
.rib:hover .bar{filter:brightness(1.12)}
.rib .pips{display:flex;gap:2px;height:9px;align-items:center}
.rib .pips i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}
.bar{width:100%;border-radius:3px 3px 0 0;position:relative;display:flex;
  align-items:flex-start;justify-content:center;padding-top:6px;transition:filter .15s}
.bar span{font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff}
.rib .pos{font-family:var(--display);font-size:15px;font-weight:800;line-height:1}
.rib .yr{font-family:var(--mono);font-size:9.5px;color:var(--text-3);letter-spacing:.02em}
.rib[aria-current="true"] .yr{color:var(--garnet);font-weight:600}

/* ---------- honours ledger ---------- */
.ledger{overflow-x:auto}
.ledger table{border-collapse:collapse;font-size:12px;min-width:640px}
.ledger th{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--text-3);
  padding:0 0 9px;text-align:center;letter-spacing:.02em}
.ledger th.rowh{text-align:left;padding-right:14px;font-family:var(--body);font-size:12px;
  color:var(--text-2);font-weight:500;white-space:nowrap}
.ledger td{text-align:center;padding:3px 2px}
.cell{width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600}
.cell.win{background:var(--garnet);color:#fff}
.cell.near{background:var(--sunk);border:1px solid var(--line);color:var(--text-2)}
.cell.none{color:var(--text-3);opacity:.45}

/* ---------- generic table ---------- */
.tblwrap{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
table.data th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);font-weight:500;padding:0 12px 9px 0;
  border-bottom:1px solid var(--line);white-space:nowrap}
table.data th.num,table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--garnet)}
table.data th[data-active="true"]{color:var(--garnet)}
table.data td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.data tbody tr:hover td{background:var(--panel-2)}
table.data tbody tr.click{cursor:pointer}
.name-cell{font-weight:500}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--text-3)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;
  padding:2px 7px;border-radius:99px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.flat{background:var(--panel-2);color:var(--text-2)}
.pill.win{background:var(--garnet);color:#fff}

/* ---------- season detail ---------- */
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.kv dt{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:.04em;
  text-transform:uppercase;padding-top:3px}
.kv dd{margin:0;color:var(--text)}
.leaders{display:flex;flex-direction:column;gap:11px}
.leader{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.leader:last-child{border-bottom:0;padding-bottom:0}
.leader .who{display:flex;flex-direction:column}
.leader .role{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3)}
.leader .nm{font-weight:500}
.leader .v{font-family:var(--display);font-size:21px;font-weight:800;color:var(--garnet);
  font-variant-numeric:tabular-nums}
.xfer{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.xfer:last-child{border-bottom:0}
.xfer .dir{font-family:var(--mono);font-size:10px;width:22px;flex:none;padding-top:2px}
.xfer .dir.in{color:var(--ok)} .xfer .dir.out{color:var(--bad)}
.xfer .who{flex:1;min-width:0}
.xfer .nm{font-weight:500;display:block}
.xfer .cl{color:var(--text-3);font-size:11.5px}
.xfer .fee{font-family:var(--mono);font-size:11.5px;color:var(--text-2);white-space:nowrap;padding-top:2px}
.note{background:var(--sunk);border-left:2px solid var(--garnet);padding:11px 14px;
  border-radius:0 5px 5px 0;font-size:12.5px;color:var(--text-2)}

/* ---------- player detail ---------- */
.p-head{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.p-id h2{font-size:31px;line-height:1.1}
.p-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.radar-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.attr-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
.attr-col h4{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);font-weight:500;margin-bottom:9px}
.attr{display:flex;align-items:center;gap:8px;padding:2.5px 0;font-size:12.5px}
.attr .an{flex:1;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attr .track{width:44px;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;flex:none}
.attr .track i{display:block;height:100%;border-radius:2px}
.attr .av{font-family:var(--mono);font-size:11.5px;width:17px;text-align:right;
  font-variant-numeric:tabular-nums;flex:none}
.trophy-row{display:flex;gap:7px;flex-wrap:wrap}
.trophy{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--sunk);
  border-radius:6px;padding:9px 13px;min-width:56px}
.trophy .n{font-family:var(--display);font-size:20px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.trophy .l{font-size:10.5px;color:var(--text-3)}
.trophy.has{background:var(--garnet-soft);box-shadow:inset 0 0 0 1px var(--garnet)}
.trophy.has .n{color:var(--garnet)}
.awards{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto}
.awards div{font-size:12.5px;color:var(--text-2);padding-left:13px;position:relative}
.awards div::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--gold)}
.back{background:none;border:0;cursor:pointer;font-family:var(--mono);font-size:11px;
  color:var(--text-3);padding:0;letter-spacing:.04em}
.back:hover{color:var(--garnet)}

/* ---------- chronicle ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{font:inherit;font-size:12.5px;background:var(--panel);
  color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 10px;min-width:0}
.filters input{flex:1;min-width:150px}
.filters input:focus,.filters select:focus{outline:2px solid var(--garnet);outline-offset:1px}
.chron{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.ev .when{font-family:var(--mono);font-size:11px;color:var(--garnet);font-weight:500;padding-top:2px}
.ev .what{min-width:0}
.ev .f{font-size:13px;margin-bottom:3px}
.ev .src{font-family:var(--mono);font-size:10px;color:var(--text-3)}

/* ---------- integrity ---------- */
.finding{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--panel);
  display:flex;flex-direction:column;gap:7px}
.finding.high{border-left:3px solid var(--bad)}
.finding.medium{border-left:3px solid var(--warn)}
.finding.low{border-left:3px solid var(--text-3)}
.finding h4{font-size:14.5px;font-family:var(--display);font-weight:800}
.finding p{margin:0;font-size:12.5px;color:var(--text-2)}
.finding .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;font-size:12.5px}
.brow .lb{display:flex;align-items:center;gap:8px;min-width:0}
.brow .lb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tr{flex:1;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:24px}
.brow .tr i{display:block;height:100%;background:var(--azul);border-radius:3px}
.brow .vv{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--text-2);
  font-variant-numeric:tabular-nums}
.clasico{display:flex;gap:3px;flex-wrap:wrap}
.cl-m{width:23px;height:23px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;color:#fff}
.cl-m.W{background:var(--ok)} .cl-m.L{background:var(--bad)} .cl-m.D{background:var(--text-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;
  color:var(--text-3);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}


/* ---------- nav groups ---------- */
nav .grp{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);padding:12px 10px 5px;opacity:.75}
nav .grp:first-child{padding-top:0}

/* ---------- champions grid ---------- */
.grid-wrap{overflow-x:auto}
table.champs{border-collapse:collapse;font-size:11.5px;min-width:820px}
table.champs th{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--text-3);
  padding:0 6px 9px;text-align:center;white-space:nowrap}
table.champs th.rowh{text-align:left;font-family:var(--body);font-size:12px;color:var(--text-2);
  padding-right:14px;position:sticky;left:0;background:var(--panel)}
table.champs td{padding:3px 4px;text-align:center}
table.champs td span{display:block;padding:5px 7px;border-radius:4px;background:var(--sunk);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px;font-size:11px}
table.champs td span.barca{background:var(--garnet);color:#fff;font-weight:500}

/* ---------- standings ---------- */
tr.q-ucl td:first-child{box-shadow:inset 3px 0 0 var(--azul)}
tr.q-uel td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tr.q-rel td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.q-win td:first-child{box-shadow:inset 3px 0 0 var(--gold)}

/* ---------- podium ---------- */
.podiums{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.podium{border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;background:var(--panel)}
.podium h4{font-family:var(--mono);font-size:11px;color:var(--garnet);letter-spacing:.05em;
  font-weight:600;margin-bottom:10px}
.podium ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.podium li{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:baseline;font-size:12.5px}
.podium .r{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.podium .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .cl{font-size:11px;color:var(--text-3);white-space:nowrap}
.podium li:first-child .nm{color:var(--garnet)}

/* ---------- resolution console ---------- */
.queue{display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px 18px;
  display:flex;flex-direction:column;gap:12px}
.card.done{opacity:.62}
.card.v-exact{border-left:3px solid var(--ok)}
.card.v-strong{border-left:3px solid var(--azul)}
.card.v-weak{border-left:3px solid var(--warn)}
.card.v-no_candidate{border-left:3px solid var(--text-3)}
.card-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.card-name{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ctx{font-size:12px;color:var(--text-3);line-height:1.9}
.ctx b{color:var(--text-2);font-weight:500}
.cand{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;background:var(--sunk)}
.cand + .cand{margin-top:7px}
.cand .who{min-width:0}
.cand .cn{font-weight:500;font-size:13.5px}
.cand .cid{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-left:7px}
.cand .why{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.score{display:flex;align-items:center;gap:8px}
.score .bar{width:52px;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.score .bar i{display:block;height:100%;border-radius:3px}
.score .pc{font-family:var(--mono);font-size:11px;width:32px;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--text-2)}
.prog{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.decided{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-2);
  background:var(--ok-bg);border-radius:6px;padding:9px 12px}
.decided.skip{background:var(--panel-2)}
.decided.new{background:var(--warn-bg)}

/* ---------- time travel ---------- */
.daterail{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;align-items:flex-end}
.day{flex:1 1 42px;min-width:30px;background:none;border:0;padding:0;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:5px}
.day .stalk{width:100%;border-radius:3px 3px 0 0;background:var(--azul);opacity:.5;transition:opacity .15s}
.day:hover .stalk,.day[aria-current="true"] .stalk{opacity:1;background:var(--garnet)}
.day .dl{font-family:var(--mono);font-size:9px;color:var(--text-3);writing-mode:vertical-rl;
  transform:rotate(180deg);letter-spacing:.02em;height:52px}
.day[aria-current="true"] .dl{color:var(--garnet);font-weight:600}
.learned{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.learned div{background:var(--sunk);border-radius:6px;padding:11px 13px}
.learned .ln{font-family:var(--display);font-size:21px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--garnet)}
.learned .ll{font-size:11.5px;color:var(--text-3);margin-top:5px}
.move{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.move:last-child{border-bottom:0}
.move .mv{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--text-3)}
.move .md{font-family:var(--mono);font-size:11.5px;font-weight:600;width:28px;text-align:right}
.move .md.up{color:var(--ok)} .move .md.down{color:var(--bad)}

/* ---------- import ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;
  cursor:pointer;font-size:12.5px;color:var(--text-2)}
.chip:hover{border-color:var(--garnet)}
.chip[aria-pressed="true"]{background:var(--garnet);border-color:var(--garnet);color:#fff}
textarea.paste{width:100%;min-height:180px;font-family:var(--mono);font-size:12px;line-height:1.7;
  background:var(--sunk);color:var(--text);border:1px solid var(--line);border-radius:6px;
  padding:12px 14px;resize:vertical}
textarea.paste:focus{outline:2px solid var(--garnet);outline-offset:1px}
.btn{background:var(--garnet);color:#fff;border:0;border-radius:6px;padding:9px 18px;cursor:pointer;
  font-size:13px;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text-2)}
.btn.ghost:hover{border-color:var(--garnet);color:var(--text);filter:none}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad);padding:5px 11px;font-size:11.5px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:6px 0;
  border-bottom:1px solid var(--line-soft);font-size:12.5px}
.maprow:last-child{border-bottom:0}
.maprow .src{font-family:var(--mono);font-size:11.5px;color:var(--text-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.maprow .arw{color:var(--text-3);font-family:var(--mono);font-size:11px}
.maprow select{font:inherit;font-size:12.5px;background:var(--panel-2);color:var(--text);
  border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:100%}
.batch{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.batch:last-child{border-bottom:0}
.batch .bm{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:3px}
.hint{font-size:12px;color:var(--text-3);background:var(--sunk);border-radius:6px;padding:11px 14px;
  line-height:1.75}
.hint code{font-family:var(--mono);font-size:11px;color:var(--text-2)}
.empty{text-align:center;padding:34px 20px;color:var(--text-3);font-size:12.5px}

@media (max-width:900px){
  :root{--rail:0px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;border-right:0;
    border-bottom:1px solid var(--line);padding:18px 16px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  nav button{width:auto;white-space:nowrap;padding:7px 12px}
  nav .k{display:none}
  /* the horizontal scroller has no room for group headers */
  nav .grp{display:none}
  .strip div{padding:13px 15px}
  .strip .n{font-size:25px}
  .rail-foot{margin-top:0}
  main{padding:26px 16px 70px}
  .two,.radar-wrap{grid-template-columns:minmax(0,1fr)}
  .view-head h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="stamp">
      <div class="crest"><i style="background:var(--garnet)"></i><i style="background:var(--azul)"></i><i style="background:var(--garnet)"></i><i style="background:var(--azul)"></i></div>
      <h1>藍紅檔案館</h1>
      <div class="sub" id="stampSub">FM24 · v6.4.0</div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
    <button class="themer" id="themer" type="button">切換主題</button>
  </aside>
  <main id="main"></main>
</div>

<script>
const DATA = "__ARCHIVE_DATA__";

/* ------------------------------------------------------------------ utils */
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const svg = (tag, attrs = {}, ...kids) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) n.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid) n.append(kid);
  return n;
};
const fmt = (n, d = 0) => (n === null || n === undefined || Number.isNaN(n)) ? "—" : Number(n).toFixed(d);
const dash = v => (v === null || v === undefined || v === "") ? "—" : v;

/* status strings in the workbook are long sentences; classify by prefix */
const statusPill = s => {
  if (!s) return el("span", { class: "pill flat" }, "無狀態");
  const t = String(s);
  const short = t.length > 16 ? t.slice(0, 14) + "…" : t;
  const kind = t.startsWith("已確認") || t.startsWith("VERIFIED") ? "ok"
    : (t.includes("未解析") || t.includes("UNRESOLVED") || t.includes("PRESERVED")) ? "warn" : "flat";
  return el("span", { class: "pill " + kind, title: t }, short);
};

/* ------------------------------------------------------------------ views */
const VIEWS = [
  { id: "world",     group: "世界", label: "世界總覽",   render: renderWorld },
  { id: "leagues",   group: "世界", label: "聯賽積分榜", render: renderLeagues },
  { id: "honours",   group: "世界", label: "榮譽殿堂",   render: renderHonours },
  { id: "chronicle", group: "世界", label: "編年史",     render: renderChronicle },
  { id: "timetravel", group: "世界", label: "認知史",    render: renderTimeTravel },
  { id: "people",    group: "檔案", label: "球員名錄",   render: renderPeople },
  { id: "dynasty",   group: "檔案", label: "巴薩王朝",   render: renderDynasty },
  { id: "seasons",   group: "檔案", label: "巴薩賽季",   render: renderSeasons },
  { id: "squad",     group: "檔案", label: "巴薩陣容",   render: renderSquad },
  { id: "resolve",   group: "工具", label: "身分解析",   render: renderResolve },
  { id: "import",    group: "工具", label: "匯入資料",   render: renderImport },
  { id: "integrity", group: "工具", label: "檔案完整性", render: renderIntegrity },
];

const state = {
  view: "world",
  league: DATA.world.leagues.includes("LaLiga EA Sports") ? "LaLiga EA Sports" : DATA.world.leagues[0],
  leagueSeason: DATA.world.seasons[DATA.world.seasons.length - 1],
  award: "Ballon d\u2019Or",
  personQuery: "",
  personFilter: "awards",
  person: null,
  importKind: "season",
  resolveFilter: "todo",
  resolveQuery: "",
  decisions: null,
  ttDate: null,
  importParsed: null,
  importMap: {},
  batches: null,
  season: DATA.seasons[DATA.seasons.length - 1].id,
  player: null,
  sort: { key: "apps", dir: -1 },
  chronQuery: "",
  chronType: "",
  snapshot: null,
};

/* ------------------------------------------------------- dynasty overview */
function renderDynasty() {
  const s = DATA.seasons;
  const titles = s.reduce((a, x) => a + x.titles.length, 0);
  const ligaWins = s.filter(x => x.position === "1").length;
  const uclWins = s.filter(x => x.ucl === "冠軍").length;
  const points = s.reduce((a, x) => a + x.points, 0);

  const maxPoints = Math.max(...s.map(x => x.points), 1);
  const ribbon = el("div", { class: "ribbon" }, s.map(x => {
    const h = 34 + Math.round((x.points / maxPoints) * 96);
    const champion = x.position === "1";
    return el("button", {
      class: "rib", type: "button", "aria-current": String(x.id === state.season),
      title: `${x.season}　西甲第 ${dash(x.position)} 名・${x.points} 分・${x.titles.length} 冠`,
      onClick: () => { state.season = x.id; go("seasons"); },
    },
      el("div", { class: "pips" }, x.titles.map(() => el("i"))),
      el("div", {
        class: "bar",
        style: `height:${h}px;background:${champion ? "var(--garnet)" : "var(--azul)"};opacity:${champion ? 1 : .55}`,
      }, el("span", {}, x.points)),
      el("div", { class: "pos" }, dash(x.position)),
      el("div", { class: "yr" }, x.season.replace("20", "").replace("/", "/")));
  }));

  const comps = [
    ["西甲", x => x.position === "1" ? ["win", "1"] : x.position ? ["near", x.position] : ["none", "—"]],
    ["歐冠", x => badge(x.ucl)],
    ["國王盃", x => badge(x.copa)],
    ["西超盃", x => badge(x.supercopa)],
    ["歐超盃", x => badge(x.superCup)],
    ["世俱盃", x => badge(x.cwc)],
  ];
  function badge(v) {
    if (!v) return ["none", "—"];
    if (v === "冠軍") return ["win", "★"];
    const map = { "亞軍": "2", "四強": "SF", "八強": "QF", "十六強": "R16", "小組賽": "GS" };
    return ["near", map[v] || (v.startsWith("排名") ? v.replace("排名 ", "") : v.slice(0, 2))];
  }

  const ledger = el("div", { class: "ledger" },
    el("table", {},
      el("thead", {}, el("tr", {}, el("th", { class: "rowh" }, "賽事"),
        s.map(x => el("th", {}, x.season.slice(2))))),
      el("tbody", {}, comps.map(([name, fn]) =>
        el("tr", {}, el("th", { class: "rowh" }, name),
          s.map(x => {
            const [cls, txt] = fn(x);
            return el("td", {}, el("span", { class: "cell " + cls, title: `${x.season} ${name}` }, txt));
          }))))));

  const cl = DATA.clasico;
  const w = cl.filter(m => m.verdict === "W").length;
  const d = cl.filter(m => m.verdict === "D").length;
  const l = cl.filter(m => m.verdict === "L").length;

  return [
    el("div", { class: "view-head" },
      el("div", { class: "eyebrow" }, "2023/24 – 2034/35　十二季"),
      el("h2", {}, "巴塞隆納王朝總覽"),
      el("p", {}, "每個數字都能回推到一列來源紀錄。點擊任一賽季柱狀可進入該季檔案。")),
    el("div", { class: "strip" },
      el("div", { class: "garnet" }, el("div", { class: "n tnum" }, titles), el("div", { class: "l" }, "總冠軍數")),
      el("div", {}, el("div", { class: "n tnum" }, ligaWins), el("div", { class: "l" }, "西甲冠軍")),
      el("div", {}, el("div", { class: "n tnum" }, uclWins), el("div", { class: "l" }, "歐冠冠軍")),
      el("div", {}, el("div", { class: "n tnum" }, Math.round(points / s.length)), el("div", { class: "l" }, "每季平均積分")),
      el("div", {}, el("div", { class: "n tnum" }, DATA.players.length), el("div", { class: "l" }, "在檔球員")),
    ),
    el("section", { class: "panel" },
      el("h3", {}, "聯賽積分與冠軍軌跡"),
      el("p", { class: "cap" }, "柱高為西甲積分，柱內數字為積分，柱下為最終名次；上方金點為該季冠軍數。"),
      ribbon),
    el("section", { class: "panel" },
      el("h3", {}, "六項賽事榮譽總表"),
      el("p", { class: "cap" }, "★ 冠軍　數字／縮寫 為當季最終成績　— 表示來源未提供。"),
      ledger,
      el("div", { class: "legend" },
        el("span", {}, el("i", { style: "background:var(--garnet)" }), "冠軍"),
        el("span", {}, el("i", { style: "background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)" }), "有成績紀錄"),
        el("span", {}, el("i", { style: "background:var(--gold);border-radius:50%" }), "冠軍計點"))),
    el("section", { class: "panel" },
      el("h3", {}, "國家德比戰績"),
      el("p", { class: "cap" }, `${cl.length} 場有紀錄的對戰　${w} 勝 ${d} 和 ${l} 負，依日期排列。`),
      el("div", { class: "clasico" }, cl.map(m =>
        el("div", {
          class: "cl-m " + (m.verdict || "D"),
          title: `${m.date}　${m.competition}　${m.home} ${m.result} ${m.away}`,
        }, m.verdict || "?"))),
      el("div", { class: "legend" },
        el("span", {}, el("i", { style: "background:var(--ok)" }), "勝"),
        el("span", {}, el("i", { style: "background:var(--text-3)" }), "和"),
        el("span", {}, el("i", { style: "background:var(--bad)" }), "負"))),
  ];
}

/* ---------------------------------------------------------- season detail */
function renderSeasons() {
  const s = DATA.seasons.find(x => x.id === state.season) || DATA.seasons[0];
  const picker = el("div", { class: "filters" },
    el("select", { id: "seasonPick", onChange: e => { state.season = e.target.value; paint(); } },
      DATA.seasons.slice().reverse().map(x =>
        el("option", { value: x.id, selected: x.id === s.id }, `${x.season}　${x.titles.length} 冠`))));

  const record = `${s.w}勝 ${s.d}和 ${s.l}負`;
  const gd = (s.gf !== null && s.ga !== null) ? `${s.gf} : ${s.ga}` : "來源未提供";

  const leaders = [
    ["最佳射手", s.topScorer, s.topScorerGoals],
    ["助攻王", s.topAssist, s.topAssistCount],
    ["最高評分", s.bestRatingPlayer, s.bestRating],
    ["最多 MOTM", s.mostMotmPlayer, s.mostMotm],
  ].filter(([, who]) => who);

  return [
    el("div", { class: "view-head" },
      el("div", { class: "eyebrow" }, "賽季檔案"),
      el("h2", {}, `${s.season} 賽季`),
      el("p", {}, s.titles.length
        ? `本季奪得 ${s.titles.join("、")}，共 ${s.titles.length} 冠。`
        : "本季無冠軍紀錄。")),
    picker,
    el("div", { class: "strip" },
      el("div", { class: "garnet" }, el("div", { class: "n tnum" }, dash(s.position)), el("div", { class: "l" }, "西甲名次")),
      el("div", {}, el("div", { class: "n tnum" }, s.points), el("div", { class: "l" }, "積分")),
      el("div", {}, el("div", { class: "n tnum" }, s.titles.length), el("div", { class: "l" }, "冠軍數")),
      el("div", {}, el("div", { class: "n tnum", style: "font-size:17px" }, dash(s.ucl)), el("div", { class: "l" }, "歐冠成績")),
      el("div", {}, el("div", { class: "n tnum", style: "font-size:17px" }, dash(s.copa)), el("div", { class: "l" }, "國王盃")),
    ),
    el("div", { class: "two" },
      el("section", { class: "panel" },
        el("h3", {}, "球季概況"),
        el("p", { class: "cap" }, "欄位由來源表程式化衍生，非公式快取。"),
        el("dl", { class: "kv" },
          el("dt", {}, "聯賽戰績"), el("dd", { class: "tnum" }, record),
          el("dt", {}, "進球 / 失球"), el("dd", { class: "tnum" }, gd),
          el("dt", {}, "西超盃"), el("dd", {}, dash(s.supercopa)),
          el("dt", {}, "歐超盃"), el("dd", {}, dash(s.superCup)),
          el("dt", {}, "世俱盃"), el("dd", {}, dash(s.cwc)),
          el("dt", {}, "球迷年度"), el("dd", {}, dash(s.fanPlayer)),
          el("dt", {}, "最高身價轉入"), el("dd", {}, dash(s.arrival)),
          el("dt", {}, "最高身價轉出"), el("dd", {}, dash(s.departure)),
          el("dt", {}, "淨支出"), el("dd", { class: "mono" }, dash(s.netSpend)),
          s.ballonDor ? el("dt", {}, "本季金球") : null,
          s.ballonDor ? el("dd", {}, `${s.ballonDor.player}（${s.ballonDor.club}）`) : null),
        s.note ? el("div", { class: "note", style: "margin-top:16px" }, s.note) : null),
      el("section", { class: "panel" },
        el("h3", {}, "球季個人領先"),
        el("p", { class: "cap" }, "取自 Barcelona_Season_Master 衍生欄位。"),
        el("div", { class: "leaders" }, leaders.map(([role, who, val]) =>
          el("div", { class: "leader" },
            el("div", { class: "who" }, el("div", { class: "role" }, role), el("div", { class: "nm" }, who)),
            el("div", { class: "v" }, dash(val))))))),
    el("div", { class: "two" },
      el("section", { class: "panel" },
        el("h3", {}, `轉入　${s.transfersIn.length}`),
        el("p", { class: "cap" }, "來源：Barcelona_Transfers"),
        s.transfersIn.length
          ? el("div", {}, s.transfersIn.map(t => xferRow(t, "in")))
          : el("p", { class: "cap" }, "本季無轉入紀錄。")),
      el("section", { class: "panel" },
        el("h3", {}, `轉出　${s.transfersOut.length}`),
        el("p", { class: "cap" }, "來源：Barcelona_Transfers"),
        s.transfersOut.length
          ? el("div", {}, s.transfersOut.map(t => xferRow(t, "out")))
          : el("p", { class: "cap" }, "本季無轉出紀錄。"))),
  ];
}
const xferRow = (t, dir) => el("div", { class: "xfer" },
  el("div", { class: "dir " + dir }, dir === "in" ? "IN" : "OUT"),
  el("div", { class: "who" }, el("span", { class: "nm" }, t.player), el("span", { class: "cl" }, dash(t.club))),
  el("div", { class: "fee" }, dash(t.fee)));

/* ------------------------------------------------------------------ squad */
const SQUAD_COLS = [
  { key: "name", label: "球員", num: false },
  { key: "position", label: "位置", num: false },
  { key: "seasons", label: "季", num: true },
  { key: "apps", label: "出場", num: true },
  { key: "goals", label: "進球", num: true },
  { key: "assists", label: "助攻", num: true },
  { key: "motm", label: "MOTM", num: true },
  { key: "rating", label: "評分", num: true },
  { key: "trophyTotal", label: "團隊冠軍", num: true },
];

function renderSquad() {
  if (state.player) return renderPlayer();
  const rows = DATA.players.map(p => ({
    ...p, trophyTotal: Object.values(p.titles).reduce((a, b) => a + b, 0),
  }));
  const { key, dir } = state.sort;
  rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (typeof x === "string" || typeof y === "string") return String(x ?? "").localeCompare(String(y ?? "")) * dir;
    return ((x ?? -1) - (y ?? -1)) * dir;
  });

  return [
    el("div", { class: "view-head" },
      el("div", { class: "eyebrow" }, `${DATA.players.length} 名在檔球員`),
      el("h2", {}, "王朝陣容名冊"),
      el("p", {}, "巴塞隆納生涯累計數據，團隊冠軍依 A1 歸屬政策計算（該季在隊即計入）。點欄位標題排序，點列查看球員檔案。")),
    el("section", { class: "panel" },
      el("div", { class: "tblwrap" },
        el("table", { class: "data" },
          el("thead", {}, el("tr", {}, SQUAD_COLS.map(c =>
            el("th", {
              class: "sortable" + (c.num ? " num" : ""), "data-active": String(key === c.key),
              onClick: () => {
                state.sort = { key: c.key, dir: key === c.key ? -dir : (c.num ? -1 : 1) };
                paint();
              },
            }, c.label + (key === c.key ? (dir < 0 ? " ↓" : " ↑") : ""))))),
          el("tbody", {}, rows.map(p =>
            el("tr", { class: "click", onClick: () => { state.player = p.id; paint(); } },
              el("td", { class: "name-cell" }, p.name,
                p.ballonTop3 ? el("span", { class: "pill win", style: "margin-left:7px" }, `金球前三 ×${p.ballonTop3}`) : null),
              el("td", { class: "mono" }, dash(p.position)),
              el("td", { class: "num tnum" }, p.seasons),
              el("td", { class: "num tnum" }, p.apps),
              el("td", { class: "num tnum" }, p.goals),
              el("td", { class: "num tnum" }, p.assists),
              el("td", { class: "num tnum" }, p.motm),
              el("td", { class: "num tnum" }, fmt(p.rating, 2)),
              el("td", { class: "num tnum" }, p.trophyTotal))))))),

/* the 2034/35 double-entry is a real defect; flag it where it would inflate a sum */
function dupWarning(stats) {
  const seen = new Map();
  for (const s of stats) {
    const key = s.season.replace(/[^0-9]/g, "");
    seen.set(key, (seen.get(key) || 0) + 1);
  }
  const dupes = [...seen].filter(([, n]) => n > 1);
  if (!dupes.length) return null;
  return el("div", { class: "note", style: "margin-bottom:16px" },
    `注意：${dupes.map(([k]) => k.slice(0, 4) + "/" + k.slice(4)).join("、")} 在來源中有兩筆賽季總計（Season_Display 寫法不一致），`
    + "下方圖表與表格照實呈現，未合併。詳見「檔案完整性」。");
}

/* goals / assists per season, drawn to one shared scale */
function seasonChart(stats) {
  const W = 700, H = 160, PAD_L = 30, PAD_B = 26, PAD_T = 12;
  const max = Math.max(...stats.map(s => Math.max(s.goals, s.assists)), 5);
  const step = (W - PAD_L - 12) / stats.length;
  const bw = Math.min(16, step / 2.6);
  const y = v => PAD_T + (1 - v / max) * (H - PAD_T - PAD_B);
  const ticks = [0, Math.round(max / 2), max];

  return el("div", { style: "overflow-x:auto" },
    svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img",
      "aria-label": "逐季進球與助攻", style: "min-width:520px;display:block" },
      ticks.map(t => svg("g", {},
        svg("line", { x1: PAD_L, x2: W - 6, y1: y(t), y2: y(t), stroke: "currentColor", "stroke-opacity": t === 0 ? .28 : .1 }),
        svg("text", { x: PAD_L - 7, y: y(t) + 4, "text-anchor": "end", fill: "currentColor",
          "fill-opacity": .5, "font-size": 10, "font-family": "IBM Plex Mono, monospace" }, t))),
      stats.map((s, i) => {
        const cx = PAD_L + step * i + step / 2;
        return svg("g", {},
          svg("rect", { x: cx - bw - 1, y: y(s.goals), width: bw, height: Math.max(1, y(0) - y(s.goals)),
            fill: "var(--garnet)", rx: 2 }, svg("title", {}, `${s.season} 進球 ${s.goals}`)),
          svg("rect", { x: cx + 1, y: y(s.assists), width: bw, height: Math.max(1, y(0) - y(s.assists)),
            fill: "var(--azul)", "fill-opacity": .75, rx: 2 }, svg("title", {}, `${s.season} 助攻 ${s.assists}`)),
          svg("text", { x: cx, y: H - 9, "text-anchor": "middle", fill: "currentColor", "fill-opacity": .5,
            "font-size": 9.5, "font-family": "IBM Plex Mono, monospace" }, s.season.slice(2)));
      })),
    el("div", { class: "legend" },
      el("span", {}, el("i", { style: "background:var(--garnet)" }), "進球"),
      el("span", {}, el("i", { style: "background:var(--azul);opacity:.75" }), "助攻")));
}

/* six-axis summary of the 36 raw FM attributes */
function radarChart(axes) {
  const W = 300, H = 250, C = W / 2, CY = H / 2, R = 72;
  const pt = (i, r) => {
    const a = (Math.PI * 2 * i) / axes.length - Math.PI / 2;
    return [C + Math.cos(a) * r, CY + Math.sin(a) * r];
  };
  const poly = axes.map((d, i) => pt(i, (d.value / 20) * R).join(",")).join(" ");
  return el("div", {},
    svg("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": "六維能力概覽",
      style: "max-width:270px;display:block" },
      [5, 10, 15, 20].map(ring => svg("polygon", {
        points: axes.map((_, i) => pt(i, (ring / 20) * R).join(",")).join(" "),
        fill: "none", stroke: "currentColor", "stroke-opacity": ring === 20 ? .25 : .1,
      })),
      axes.map((_, i) => svg("line", {
        x1: C, y1: CY, x2: pt(i, R)[0], y2: pt(i, R)[1], stroke: "currentColor", "stroke-opacity": .12,
      })),
      svg("polygon", { points: poly, fill: "var(--garnet)", "fill-opacity": .22,
        stroke: "var(--garnet)", "stroke-width": 1.8, "stroke-linejoin": "round" }),
      axes.map((d, i) => {
        const [x, y] = pt(i, (d.value / 20) * R);
        return svg("circle", { cx: x, cy: y, r: 2.6, fill: "var(--garnet)" });
      }),
      axes.map((d, i) => {
        const [x, y] = pt(i, R + 22);
        const anchor = x > C + 6 ? "start" : x < C - 6 ? "end" : "middle";
        return svg("text", {
          x: Math.min(Math.max(x, 4), W - 4), y: y + 3.5, "text-anchor": anchor,
          fill: "currentColor", "fill-opacity": .68, "font-size": 11,
          "font-family": "IBM Plex Mono, monospace",
        }, `${d.axis} ${d.value}`);
      })));
}

/* ===================================================================
   IDENTITY RESOLUTION CONSOLE
   445 award rows across 212 raw names carry no Player_ID. Candidates are
   computed at build time (OpenCC + the full accepted-association index);
   this view presents them with their evidence and records the decision.
   =================================================================== */

const VERDICT_META = {
  exact:        { label: "正規化後完全相同", cls: "ok" },
  strong:       { label: "高可信候選",       cls: "ok" },
  weak:         { label: "需人工判斷",       cls: "warn" },
  no_candidate: { label: "查無候選",         cls: "flat" },
};

const RESOLVE_FILTERS = [
  { id: "todo", label: "待處理", test: (i, d) => !d[i.raw] },
  { id: "cand", label: "有候選", test: (i, d) => !d[i.raw] && i.candidates.length },
  { id: "none", label: "無候選（需建新身分）", test: (i, d) => !d[i.raw] && !i.candidates.length },
  { id: "done", label: "已決定", test: (i, d) => !!d[i.raw] },
  { id: "all", label: "全部", test: () => true },
];

async function loadDecisions() {
  const db = await getDb();
  if (!db) { state.decisions = "unavailable"; return; }
  try {
    const docs = await db.collection("identity_decisions").limit(500).get();
    const map = {};
    docs.forEach(d => { map[d.data.raw] = d.data; });
    state.decisions = map;
  } catch (e) { state.decisions = "unavailable"; }
}

async function decide(item, action, playerId) {
  const db = await getDb();
  if (!db) return;
  const doc = {
    raw: item.raw,
    action,                       // confirm | new | reject
    playerId: playerId || null,
    playerName: playerId ? (item.candidates.find(c => c.id === playerId)?.name ?? null) : null,
    rows: item.rows,
    verdict: item.verdict,
    topScore: item.candidates[0]?.score ?? null,
    decidedAt: new Date().toISOString(),
  };
  /* doc id must be stable and path-safe; the raw name is neither */
  const key = "d" + [...item.raw].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7).toString(36)
    + "-" + item.rows;
  try {
    await db.doc("identity_decisions/" + key).set(doc);
    if (state.decisions && state.decisions !== "unavailable") state.decisions[item.raw] = doc;
  } catch (e) {
    state.resolveError = e?.code === "not_granted"
      ? "沒有寫入權限，決定無法保存。" : "寫入失敗：" + (e?.message || e?.code);
  }
  paint();
}

async function undecide(item) {
  const db = await getDb();
  if (!db) return;
  const key = "d" + [...item.raw].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7).toString(36)
    + "-" + item.rows;
  try { await db.doc("identity_decisions/" + key).delete(); } catch (e) { /* already gone */ }
  if (state.decisions && state.decisions !== "unavailable") delete state.decisions[item.raw];
  paint();
}

async function exportDecisions() {
  if (!downloadsHandle) await getDb();
  const map = state.decisions;
  if (!downloadsHandle || !map || map === "unavailable") return;
  const list = Object.values(map);
  if (!list.length) return;
  try {
    await downloadsHandle.save({
      filename: `fm24-identity-decisions-${new Date().toISOString().slice(0, 10)}.json`,
      data: JSON.stringify({
        exportedAt: new Date().toISOString(),
        schema: "FM24_IDENTITY_DECISIONS_V1",
        note: "餵給 fm24/ingest.py --identity，會寫入 Ingest_Identity_Decisions 表。",
        decisions: list,
      }, null, 2),
    });
  } catch (e) { /* viewer declined */ }
}

  if (state.decisions === null) loadDecisions().then(paint);
  const r = DATA.resolution;
  const decided = (state.decisions && state.decisions !== "unavailable") ? state.decisions : {};
  const decidedCount = Object.keys(decided).length;
  const clearedRows = Object.values(decided).reduce((a, d) => a + (d.rows || 0), 0);

  const f = RESOLVE_FILTERS.find(x => x.id === state.resolveFilter) || RESOLVE_FILTERS[0];
  const q = state.resolveQuery.trim();
  const items = r.items.filter(i => f.test(i, decided) &&
    (!q || i.raw.includes(q) || i.candidates.some(c => c.name.includes(q))));
  const shown = items.slice(0, 40);

  return [
    el("div", { class: "view-head" },

        + "評分為姓 × 0.7 ＋ 名 × 0.3，姓氏相似度過低者直接否決——中文譯名的「名」重複率太高，撐不起配對。")),
    el("div", { class: "strip" },

      el("div", {}, el("div", { class: "n tnum" }, (byVerdict.exact || 0) + (byVerdict.strong || 0)), el("div", { class: "l" }, "高可信候選")),
      el("div", {}, el("div", { class: "n tnum" }, byVerdict.weak || 0), el("div", { class: "l" }, "需人工判斷")),
      el("div", {}, el("div", { class: "n tnum" }, byVerdict.no_candidate || 0), el("div", { class: "l" }, "需建新身分")),
      el("div", {}, el("div", { class: "n tnum" }, decidedCount), el("div", { class: "l" }, "已決定")),
    ),

        ? `已決定 ${decidedCount} 個姓名，可清掉 ${clearedRows} 列（${Math.round(clearedRows / r.totalRows * 100)}%）。`
        : "尚未做出任何決定。由上而下處理，最上面的姓名一次能清掉最多列。"),
      el("div", { class: "prog" },
        el("i", { style: `width:${(clearedRows / r.totalRows) * 100}%;background:var(--garnet)` }),
        el("i", { style: `width:${(1 - clearedRows / r.totalRows) * 100}%;background:transparent` })),
      state.decisions === "unavailable" ? el("div", { class: "hint", style: "margin-top:14px" },

        el("span", { class: "cap" }, "下載後執行　", el("code", {}, "python3 ingest.py <檔案> --identity --commit"))) : null),
    r.merges.length ? el("section", { class: "panel" },

/* ===================================================================
   IMPORT — paste -> parse -> resolve identity -> append-only record
   The workbook's own model is append-only observations, so an import
   never edits anything: it records a new observation awaiting merge.
   =================================================================== */

const IMPORT_KINDS = {
  season: {
    label: "賽季數據",
    fields: ["Season", "Player", "Club", "Competition", "Apps", "Goals", "Assists", "POTM", "Rating", "Yellow", "Red"],
    required: ["Season", "Player"],
    hint: "一列一名球員一個賽季。可直接從 Excel 或 FM 匯出表格複製貼上（Tab 分隔）。",
  },
  profile: {
    label: "球員檔案",
    fields: ["Player", "Nationality", "DOB", "Club", "Position", "Shirt", "NT_Caps", "NT_Goals"],
    required: ["Player"],
    hint: "球員個人資訊。支援「欄位：值」逐行格式，空行分隔不同球員。",
  },
  standings: {
    label: "聯賽積分榜",
    fields: ["Season", "League", "Rank", "Club", "Played", "Wins", "Draws", "Losses", "Goals_For", "Goals_Against", "Points", "Note"],
    required: ["Season", "Club"],
    hint: "整張積分榜貼上即可，第一列視為標題列。",
  },
  award: {
    label: "獎項名次",
    fields: ["Season", "Award", "Rank", "Player", "Club"],
    required: ["Season", "Award", "Player"],
    hint: "獎項得主與名次。Player 欄會自動比對現有 Player_ID。",
  },
  raw: {
    label: "自由欄位",
    fields: [],
    required: [],
    hint: "保留原始標題列，不做欄位對應。適合還沒決定歸屬哪張表的資料。",
  },
};

/* header synonyms, so a pasted table usually maps itself */
const SYNONYMS = {
  Season: ["season", "賽季", "赛季", "年度", "球季"],
  Player: ["player", "球員", "球员", "姓名", "名字", "name", "選手"],
  Club: ["club", "球隊", "球队", "俱樂部", "俱乐部", "team", "所屬"],
  League: ["league", "聯賽", "联赛", "competition_league"],
  Competition: ["competition", "賽事", "赛事", "comp"],
  Apps: ["apps", "出場", "出场", "場次", "appearances", "上陣"],
  Goals: ["goals", "進球", "进球", "入球", "得分", "球"],
  Assists: ["assists", "助攻", "助"],
  POTM: ["potm", "motm", "全場最佳", "最佳球員"],
  Rating: ["rating", "評分", "评分", "平均分"],
  Yellow: ["yellow", "黃牌", "黄牌"],
  Red: ["red", "紅牌", "红牌"],
  Rank: ["rank", "名次", "排名", "位置", "pos", "名"],
  Award: ["award", "獎項", "奖项"],
  Nationality: ["nationality", "國籍", "国籍", "nation"],
  DOB: ["dob", "生日", "出生", "birth"],
  Position: ["position", "位置", "場上位置"],
  Shirt: ["shirt", "背號", "号码", "number"],
  NT_Caps: ["caps", "國家隊出場", "代表隊出場"],
  NT_Goals: ["nt_goals", "國家隊進球"],
  Played: ["played", "賽", "场次", "比賽", "pl"],
  Wins: ["wins", "勝", "胜", "w"],
  Draws: ["draws", "和", "平", "d"],
  Losses: ["losses", "負", "负", "l"],
  Goals_For: ["gf", "進", "进球数", "得球"],
  Goals_Against: ["ga", "失", "失球"],
  Points: ["points", "分", "積分", "积分", "pts"],
  Note: ["note", "備註", "备注", "說明"],
};

function guessField(header, allowed) {
  const t = String(header || "").trim().toLowerCase();
  if (!t) return "";
  for (const field of allowed) {
    if (field.toLowerCase() === t) return field;
    if ((SYNONYMS[field] || []).some(s => t === s.toLowerCase())) return field;
  }
  for (const field of allowed) {
    if ((SYNONYMS[field] || []).some(s => t.includes(s.toLowerCase()) || s.toLowerCase().includes(t))) return field;
  }
  return "";
}

/* --- identity index over every controlled name and alias ----------------- */
const normName = s => String(s || "").replace(/[·・.\s·‧]/g, "").toLowerCase();
const NAME_INDEX = (() => {
  const idx = new Map();
  for (const p of DATA.people.players) {
    for (const n of [p.name, ...p.aliases]) {
      const k = normName(n);
      if (!k) continue;
      if (!idx.has(k)) idx.set(k, []);
      if (!idx.get(k).some(x => x.id === p.id)) idx.get(k).push(p);
    }
  }
  return idx;
})();

/* character-overlap ratio: good enough for CJK transliteration drift */
function similarity(a, b) {
  if (!a || !b) return 0;
  const A = new Set(a), B = new Set(b);
  let shared = 0;
  for (const c of A) if (B.has(c)) shared++;
  return (2 * shared) / (A.size + B.size);
}

function resolveIdentity(raw) {
  const key = normName(raw);
  if (!key) return { status: "empty", candidates: [] };
  const exact = NAME_INDEX.get(key);
  if (exact && exact.length === 1) return { status: "exact", match: exact[0], candidates: exact };
  if (exact && exact.length > 1) return { status: "ambiguous", candidates: exact };

  const scored = [];
  for (const [k, people] of NAME_INDEX) {
    const score = similarity(key, k);
    if (score >= 0.6) for (const p of people) scored.push({ p, score });
  }
  scored.sort((a, b) => b.score - a.score);
  const top = scored.slice(0, 4).map(x => x.p);
  if (!top.length) return { status: "new", candidates: [] };
  if (scored.length === 1 || (scored[0].score - (scored[1]?.score ?? 0)) > 0.15) {
    return { status: "fuzzy", match: top[0], score: scored[0].score, candidates: top };
  }
  return { status: "ambiguous", candidates: top };
}

/* --- parsers ------------------------------------------------------------- */
function parseTabular(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
  if (lines.length < 2) return null;
  const sep = lines[0].includes("\t") ? "\t" : lines[0].includes(",") ? "," : /\s{2,}/;
  const split = l => (sep instanceof RegExp ? l.split(sep) : l.split(sep)).map(c => c.trim());
  const headers = split(lines[0]);
  if (headers.length < 2) return null;
  const rows = lines.slice(1).map(split).filter(r => r.some(c => c));
  return { headers, rows };
}

function parseBlocks(text) {
  const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const records = [];
  const keys = [];
  for (const block of blocks) {
    const rec = {};
    for (const line of block.split(/\r?\n/)) {
      const m = line.match(/^\s*([^:：]+)[:：]\s*(.*)$/);
      if (!m) continue;
      const k = m[1].trim();
      rec[k] = m[2].trim();
      if (!keys.includes(k)) keys.push(k);
    }
    if (Object.keys(rec).length) records.push(rec);
  }
  if (!records.length) return null;
  return { headers: keys, rows: records.map(r => keys.map(k => r[k] ?? "")) };
}

function doParse() {
  const text = document.getElementById("pasteBox").value;
  if (!text.trim()) return;
  const parsed = parseTabular(text) || parseBlocks(text);
  if (!parsed) {
    state.importParsed = { error: "認不出格式。請確認是 Tab／逗號分隔的表格，或「欄位：值」逐行格式。" };
    state.importMap = {};
    paint();
    return;
  }
  const kind = IMPORT_KINDS[state.importKind];
  const map = {};
  parsed.headers.forEach((hdr, i) => {
    map[i] = kind.fields.length ? guessField(hdr, kind.fields) : hdr;
  });
  state.importParsed = parsed;
  state.importMap = map;
  paint();
}

/* --- build the observation rows the preview and the write both use ------- */
function buildRecords() {
  const parsed = state.importParsed;
  if (!parsed || parsed.error) return [];
  const kind = IMPORT_KINDS[state.importKind];
  const playerCol = Object.entries(state.importMap).find(([, f]) => f === "Player")?.[0];

  return parsed.rows.map((cells, i) => {
    const rec = {};
    cells.forEach((v, ci) => {
      const field = state.importMap[ci];
      if (field && v !== "") rec[field] = v;
    });
    const missing = kind.required.filter(f => !rec[f]);
    const rawName = playerCol !== undefined ? cells[playerCol] : null;
    const identity = rawName ? resolveIdentity(rawName) : null;
    return { row: i + 1, values: rec, missing, rawName, identity };
  });
}

/* --- db plumbing --------------------------------------------------------- */
let dbHandle = null, dbTried = false, downloadsHandle = null;
async function getDb() {
  if (!dbTried) {
    dbTried = true;
    try { dbHandle = await claude.use("db"); } catch (e) { dbHandle = null; }
    try { downloadsHandle = await claude.use("downloads"); } catch (e) { downloadsHandle = null; }
  }
  return dbHandle;
}
async function loadBatches() {
  const db = await getDb();
  if (!db) { state.batches = "unavailable"; return; }
  try {
    const docs = await db.collection("imports").orderBy("createdAt", "desc").limit(100).get();
    state.batches = docs.map(d => ({ id: d.id, ...d.data }));
  } catch (e) {
    state.batches = "unavailable";
  }
}

async function writeBatch() {
  const db = await getDb();
  const records = buildRecords();
  if (!db || !records.length) return;
  const btn = document.getElementById("writeBtn");
  if (btn) { btn.disabled = true; btn.textContent = "寫入中…"; }
  const now = new Date().toISOString();
  const id = "imp-" + now.replace(/[^0-9]/g, "").slice(0, 14) + "-" + Math.random().toString(36).slice(2, 7);
  const matched = records.filter(r => r.identity?.match).length;
  const doc = {
    createdAt: now,
    kind: state.importKind,
    kindLabel: IMPORT_KINDS[state.importKind].label,
    columns: Object.values(state.importMap).filter(Boolean),
    /* every row keeps its raw name and the resolution verdict, so a later
       merge can audit the match instead of trusting it */
    rows: records.map(r => ({
      values: r.values,
      rawName: r.rawName,
      resolvedId: r.identity?.match?.id ?? null,
      resolution: r.identity?.status ?? "n/a",
      missing: r.missing,
    })),
    stats: { total: records.length, matched, incomplete: records.filter(r => r.missing.length).length },
    verificationStatus: "使用者匯入（待併入工作簿）",
  };
  try {
    await db.doc("imports/" + id).set(doc);
    state.importParsed = null;
    state.importMap = {};
    const box = document.getElementById("pasteBox");
    if (box) box.value = "";
    await loadBatches();
  } catch (e) {
    state.importError = e?.code === "not_granted"
      ? "沒有寫入權限。這份檔案可能是以唯讀方式分享給你的。"
      : "寫入失敗：" + (e?.message || e?.code || "未知錯誤");
  }
  paint();
}

async function deleteBatch(id) {
  const db = await getDb();
  if (!db) return;
  try { await db.doc("imports/" + id).delete(); } catch (e) { /* already gone */ }
  await loadBatches();
  paint();
}

async function exportBatches() {
  if (!downloadsHandle) await getDb();
  if (!downloadsHandle || !Array.isArray(state.batches)) return;
  const payload = {
    exportedAt: new Date().toISOString(),
    schema: "FM24_IMPORT_BATCH_V1",
    note: "餵給 fm24/ingest.py，會以 append-only 觀測列併入 SQLite。",
    batches: state.batches,
  };
  try {
    await downloadsHandle.save({
      filename: `fm24-imports-${new Date().toISOString().slice(0, 10)}.json`,
      data: JSON.stringify(payload, null, 2),
    });
  } catch (e) { /* viewer declined */ }
}

/* --- view ---------------------------------------------------------------- */
function renderImport() {
  if (state.batches === null) { loadBatches().then(paint); }
  const kind = IMPORT_KINDS[state.importKind];
  const parsed = state.importParsed;
  const records = buildRecords();

  const statusCell = r => {
    if (!r.identity) return el("span", { class: "pill flat" }, "無姓名欄");
    const s = r.identity;
    if (s.status === "exact") return el("span", { class: "pill ok", title: s.match.name }, "✓ " + s.match.id);
    if (s.status === "fuzzy") return el("span", { class: "pill warn", title: `${s.match.name}（相似度 ${(s.score * 100) | 0}%）` },
      "≈ " + s.match.id);
    if (s.status === "ambiguous") return el("span", {
      class: "pill warn", title: s.candidates.map(c => `${c.id} ${c.name}`).join("\n"),
    }, `多候選 ×${s.candidates.length}`);
    return el("span", { class: "pill bad" }, "新身分");
  };

  const preview = parsed && !parsed.error ? el("section", { class: "panel" },
    el("h3", {}, "欄位對應"),
    el("p", { class: "cap" }, "已自動猜測；不需要的欄位設為「略過」。"),
    el("div", {}, parsed.headers.map((hdr, i) =>
      el("div", { class: "maprow" },
        el("div", { class: "src", title: hdr }, hdr || `（第 ${i + 1} 欄）`),
        el("div", { class: "arw" }, "→"),
        kind.fields.length
          ? el("select", {
              id: "map" + i,
              onChange: e => { state.importMap[i] = e.target.value; paint(); },
            },
            el("option", { value: "", selected: !state.importMap[i] }, "略過"),
            kind.fields.map(f => el("option", { value: f, selected: state.importMap[i] === f }, f)))
          : el("div", { class: "mono" }, hdr)))),
    el("h3", { style: "margin-top:22px" }, `預覽　${records.length} 列`),
    el("p", { class: "cap" },
      `${records.filter(r => r.identity?.match).length} 列已比對到現有身分　·　`
      + `${records.filter(r => r.missing.length).length} 列缺必填欄位`),
    el("div", { class: "tblwrap" }, el("table", { class: "data" },
      el("thead", {}, el("tr", {},
        el("th", {}, "#"), el("th", {}, "身分比對"),
        [...new Set(Object.values(state.importMap).filter(Boolean))].map(f => el("th", {}, f)),
        el("th", {}, "檢查"))),
      el("tbody", {}, records.slice(0, 50).map(r =>
        el("tr", {},
          el("td", { class: "mono" }, r.row),
          el("td", {}, statusCell(r)),
          [...new Set(Object.values(state.importMap).filter(Boolean))].map(f =>
            el("td", {}, dash(r.values[f]))),
          el("td", {}, r.missing.length
            ? el("span", { class: "pill bad", title: "缺少必填欄位" }, "缺 " + r.missing.join("、"))
            : el("span", { class: "pill ok" }, "完整"))))))),
    records.length > 50 ? el("p", { class: "cap", style: "margin-top:10px" }, `僅顯示前 50 列，寫入時會全部保留。`) : null,
    el("div", { class: "btnrow", style: "margin-top:18px" },
      el("button", { class: "btn", type: "button", id: "writeBtn", onClick: writeBatch },
        `寫入待併入區　${records.length} 列`),
      el("button", {
        class: "btn ghost", type: "button",
        onClick: () => { state.importParsed = null; state.importMap = {}; paint(); },
      }, "取消")),
  ) : parsed?.error ? el("div", { class: "note" }, parsed.error) : null;

  const batches = state.batches;
  const pending = Array.isArray(batches) ? batches : [];
  const totalRows = pending.reduce((a, b) => a + (b.stats?.total || 0), 0);

  return [
    el("div", { class: "view-head" },
      el("div", { class: "eyebrow" }, "Append-only　匯入不覆寫任何既有資料"),
      el("h2", {}, "匯入資料"),
      el("p", {}, "貼上新資料，系統會解析欄位、比對現有 Player_ID，存成一批待併入觀測。"
        + "匯出的 JSON 可直接餵給 ingest.py 併回 SQLite 與工作簿。")),
    el("section", { class: "panel" },
      el("h3", {}, "1　選擇資料類型"),
      el("p", { class: "cap" }, "決定必填欄位與可對應的目標欄位。"),
      el("div", { class: "chips" }, Object.entries(IMPORT_KINDS).map(([id, k]) =>
        el("button", {
          class: "chip", type: "button", "aria-pressed": String(id === state.importKind),
          onClick: () => { state.importKind = id; state.importParsed = null; state.importMap = {}; paint(); },
        }, k.label))),
      el("div", { class: "hint", style: "margin-top:14px" }, kind.hint,
        kind.required.length ? el("div", { style: "margin-top:6px" },
          "必填：", el("code", {}, kind.required.join("、"))) : null),
      el("h3", { style: "margin-top:22px" }, "2　貼上資料"),
      el("p", { class: "cap" }, "支援 Tab 分隔、逗號分隔，或「欄位：值」逐行格式。"),
      el("textarea", {
        class: "paste", id: "pasteBox", spellcheck: "false",
        placeholder: state.importKind === "profile"
          ? "姓名：拉明·亞馬爾\n國籍：西班牙\n位置：AM(RL)\n\n姓名：佩德里\n國籍：西班牙"
          : "賽季\t球員\t出場\t進球\t助攻\n2035/36\t拉明·亞馬爾\t41\t18\t20",
      }),
      el("div", { class: "btnrow", style: "margin-top:12px" },
        el("button", { class: "btn", type: "button", onClick: doParse }, "解析並預覽"),
        el("button", {
          class: "btn ghost", type: "button",
          onClick: () => { document.getElementById("pasteBox").value = ""; state.importParsed = null; paint(); },
        }, "清空"))),
    state.importError ? el("div", { class: "note" }, state.importError) : null,
    preview,
    el("section", { class: "panel" },
      el("h3", {}, "待併入區"),
      el("p", { class: "cap" }, batches === "unavailable"
        ? "此檢視無法使用儲存功能。"
        : `${pending.length} 批　${totalRows} 列，尚未併入工作簿。`),
      batches === null ? el("div", { class: "empty" }, "載入中…")
        : batches === "unavailable" ? el("div", { class: "hint" },
            "儲存空間目前不可用 —— 可能是這份檔案以唯讀方式分享給你，或瀏覽器尚未授權。"
            + "解析與比對功能仍可正常使用，只是結果不會被保存。")
        : pending.length === 0 ? el("div", { class: "empty" }, "還沒有任何待併入批次。")
        : el("div", {},
            pending.map(b => el("div", { class: "batch" },
              el("div", {},
                el("div", { style: "font-weight:500" }, `${b.kindLabel}　${b.stats?.total ?? 0} 列`),
                el("div", { class: "bm" },
                  `${b.createdAt?.slice(0, 16).replace("T", " ")}　·　`
                  + `已比對 ${b.stats?.matched ?? 0}　·　`
                  + `缺欄位 ${b.stats?.incomplete ?? 0}　·　${b.id}`)),
              el("button", { class: "btn danger", type: "button", onClick: () => deleteBatch(b.id) }, "刪除"))),
            el("div", { class: "btnrow", style: "margin-top:18px" },
              el("button", { class: "btn", type: "button", onClick: exportBatches }, "匯出全部 JSON"),
              el("span", { class: "cap" }, "下載後執行　", el("code", {}, "python3 ingest.py <檔案>"))))),
  ];
}

/* ------------------------------------------------------------------ shell */
function paint() {
  const view = VIEWS.find(v => v.id === state.view);
  const main = document.getElementById("main");
  main.replaceChildren(el("div", { class: "view" }, view.render()));
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.view === state.view)));
  if (state.scrollTop) { window.scrollTo(0, 0); state.scrollTop = false; }
  const activeDay = main.querySelector('.day[aria-current="true"]');
  if (activeDay) activeDay.scrollIntoView({ block: "nearest", inline: "center" });
}
function go(id) { state.view = id; state.player = null; state.person = null; state.scrollTop = true; paint(); }

{
  const items = [];
  let group = null;
  VIEWS.forEach((v, i) => {
    if (v.group !== group) { group = v.group; items.push(el("div", { class: "grp" }, group)); }
    items.push(el("button", { type: "button", "data-view": v.id, onClick: () => go(v.id) },
      el("span", { class: "k" }, String(i + 1).padStart(2, "0")),
      el("span", { class: "t" }, v.label)));
  });
  document.getElementById("nav").replaceChildren(...items);
}

document.getElementById("stampSub").textContent =
  `${DATA.meta.sheet_count} 表 · ${DATA.meta.row_count.toLocaleString()} 列`;
document.getElementById("railFoot").replaceChildren(
  el("div", {}, el("b", {}, DATA.meta.player_count.toLocaleString()), " 名球員",
    el("span", { style: "opacity:.6" }, ` / ${DATA.meta.alias_count} 別名`)),
  el("div", {}, el("b", {}, DATA.meta.club_count.toLocaleString()), " 間俱樂部"),
  el("div", {}, el("b", {}, DATA.meta.nation_count.toLocaleString()), " 個國家"),
  el("div", { style: "margin-top:8px;opacity:.7" }, "建置 " + DATA.meta.generated));

const themer = document.getElementById("themer");
themer.addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme:dark)").matches;
  const cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("fm24-theme", next); } catch (e) { /* private mode */ }
});
try {
  const saved = localStorage.getItem("fm24-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (e) { /* private mode */ }

paint();
</script>
